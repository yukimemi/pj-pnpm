name = "pj-pnpm"
version = "0.3.0"

# pnpm-driven Node language layer. Brings the package.json
# scaffold, the TypeScript-compiler-references root, the CI
# workflow that runs the package.json scripts, the pnpm-flavoured
# renri on-add hook, and a shared .gitignore block.
# Compose under `pj-base`, then layer a framework on top
# (`pj-react-web` for Vite/React, future `pj-next-web` etc.).

# package.json — Tera-rendered so `name:` matches the project's
# directory name. `when = "once"` because each project edits its
# own scripts / deps after init; `kata apply` should never clobber
# the consumer's deps.
[[file]]
src = "package.json.tera"
dst = "package.json"
how = "overwrite"
when = "once"

# TypeScript references-root. Static, owned-by-kata so the
# project-references layout stays uniform across web projects
# using these templates. Framework layers (pj-react-web) ship the actual
# tsconfig.app.json / tsconfig.node.json that this file references.
[[file]]
src = "tsconfig.json"
how = "overwrite"
when = "always"

# .gitignore — pnpm/Node-flavoured patterns inside a marker block
# so each project can append its own entries outside the block
# without `kata apply` clobbering them.
[[file]]
src = ".gitignore.pnpm"
dst = ".gitignore"
how = "merge-section"
when = "always"
marker = { begin = "# kata:gitignore:pnpm:begin", end = "# kata:gitignore:pnpm:end" }

# pnpm-layer action pins, merged into `.kata/vars.toml` on top of
# pj-base's universal seed. `merge-toml` with an explicit `paths`
# list writes only these two keys, leaving pj-base's
# `actions.checkout` / `actions.create_pull_request` /
# `actions.claude_code_action` pins untouched.
#
# `when = "once"`: `.kata/vars.toml` is the consumer's file, so kata
# writes these two keys on the first apply and then leaves it alone,
# and a project that hand-edits a pin keeps the edit. The costs are
# real though — a project initialised before this entry existed never
# gets the keys written at all, and a bump made upstream stops
# reaching any project that already has them. `vars.pnpm.toml`
# documents both, why `ci.yml.tera` still renders in the first case,
# and the `--reseed` escape hatch for the second.
[[file]]
src = "vars.pnpm.toml"
dst = ".kata/vars.toml"
how = "merge-toml"
when = "once"
paths = ["actions.pnpm_action_setup", "actions.setup_node"]

# CI workflow. This layer owns `package.json` and its `lint` /
# `build` / `test` scripts, so it is the layer that has to ship the
# workflow that runs them — the AGENTS block below has asserted "CI
# uses `pnpm install --frozen-lockfile`" since the layer was written,
# while no consumer of it had any CI at all.
#
# Same `.tera` suffix story as pj-rust's `ci.yml.tera`: (1) GitHub
# Actions only runs `.yml` / `.yaml` under `.github/workflows/`, so
# the suffixed source stays inert inside this template repo — it must
# not try to `pnpm install` a `package.json` that is a Tera template
# here; (2) kata Tera-renders `.tera` files at apply time and strips
# the suffix on the way out, so the consumer ends up with `ci.yml`.
#
# `when = "always"`: the workflow is kata-owned, and the job name is
# the status check consumers require for merge — it has to stay
# uniform. Project-specific CI goes in a separate workflow file.
[[file]]
src = ".github/workflows/ci.yml.tera"
dst = ".github/workflows/ci.yml"
how = "overwrite"
when = "always"

# pnpm-layer agent guidance — pnpm scripts surface, lockfile
# discipline, .env handling. Lives in its own marker block so
# pj-base / pj-react-web sections coexist in the same AGENTS.md.
[[file]]
src = "AGENTS.md.pnpm"
dst = "AGENTS.md"
how = "merge-section"
when = "always"
marker = { begin = "<!-- kata:agents:pnpm:begin -->", end = "<!-- kata:agents:pnpm:end -->" }

# Replace pj-base's apm-install-only renri hook with the
# pnpm-flavoured chain (apm install --update + pnpm install +
# vcs-fetch). Consumer comments / unrelated keys (e.g. a
# project-specific `[layout]` section) survive either way, but the
# three hooks are keyed by index rather than as one array so a
# project can append its own `[[hooks.post_create]]` — copying a
# git-ignored `.env` into the fresh worktree, say — and keep it
# across `kata apply`. Two consequences worth knowing:
#
#   The index is the position in the file, not a name. Consumer
#   entries have to sit *after* these three, or the template will
#   overwrite them.
#
#   Growing pj-base's single hook to three relies on kata treating
#   an index one past the end as an append. On a kata without that
#   rule the second and third paths are silent no-ops, and a fresh
#   project ends up with `apm install` alone.
[[file]]
src = "renri.toml.pnpm"
dst = "renri.toml"
how = "merge-toml"
when = "always"
paths = [
  "hooks.post_create[0]",
  "hooks.post_create[1]",
  "hooks.post_create[2]",
]

# Renovate: repoint the consumer's `extends` at THIS layer's own
# preset (`default.json`), which extends the layer below it and adds
# whatever rules this layer owns.
#
# Every layer ships this same entry naming ITSELF; kata's compose rule
# (last layer wins on file conflicts) then resolves `extends` to the
# topmost APPLIED layer automatically. No layer needs to know what
# sits above it, and no preset var is involved.
#
# `how = "merge-json"` with `paths = ["extends"]` rewrites ONLY the
# `extends` array, leaving any consumer-added keys (labels, extra
# packageRules, …) untouched — unlike a blanket overwrite. The same
# `renovate.json` doubles as this repo's OWN Renovate config.
[[file]]
src = "renovate.json"
how = "merge-json"
when = "always"
paths = ["extends"]
